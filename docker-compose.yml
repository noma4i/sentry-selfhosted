x-restart-policy: &restart_policy
  restart: unless-stopped

x-healthcheck-defaults: &healthcheck_defaults
  interval: 30s
  timeout: 30s
  retries: 10
  start_period: 30s

x-sentry-defaults: &sentry_defaults
  <<: *restart_policy
  image: sentry-self-hosted-local
  depends_on:
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
    pgbouncer:
      condition: service_healthy
    smtp:
      condition: service_started
    seaweedfs:
      condition: service_started
    snuba-api:
      condition: service_started
  entrypoint: "/etc/sentry/entrypoint.sh"
  command: ["run", "web"]
  environment:
    PYTHONUSERBASE: "/data/custom-packages"
    SENTRY_CONF: "/etc/sentry"
    SNUBA: "http://snuba-api:1218"
    VROOM: "http://vroom:8085"
    SENTRY_EVENT_RETENTION_DAYS:
    SENTRY_MAIL_HOST:
    SENTRY_PUBLIC_URL:
    SENTRY_SYSTEM_SECRET_KEY:
  volumes:
    - "sentry-data:/data"
    - "./sentry-conf:/etc/sentry"
    - "./geoip:/geoip:ro"

x-snuba-defaults: &snuba_defaults
  <<: *restart_policy
  depends_on:
    clickhouse:
      condition: service_healthy
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy
  image: snuba-local
  build:
    context: ./source/snuba
  environment:
    SNUBA_SETTINGS: self_hosted
    CLICKHOUSE_HOST: clickhouse
    DEFAULT_BROKERS: "kafka:9092"
    REDIS_HOST: redis
    UWSGI_MAX_REQUESTS: "10000"
    UWSGI_DISABLE_LOGGING: "true"
    SENTRY_EVENT_RETENTION_DAYS:

services:
  smtp:
    <<: *restart_policy
    image: boky/postfix
    mem_limit: 64m
    volumes:
      - "dkim-keys:/etc/opendkim/keys"
    environment:
      ALLOWED_SENDER_DOMAINS: ${SENTRY_MAIL_HOST:-}
      HOSTNAME: ${SENTRY_MAIL_HOSTNAME:-}
      DKIM_AUTOGENERATE: "false"
      DKIM_SELECTOR: ${SENTRY_DKIM_SELECTOR:-}

  redis:
    <<: *restart_policy
    image: "redis:6.2.20-alpine"
    mem_limit: 128m
    healthcheck:
      <<: *healthcheck_defaults
      test: redis-cli ping | grep PONG
    volumes:
      - "sentry-redis:/data"
      - type: bind
        read_only: true
        source: ./redis-local.conf
        target: /usr/local/etc/redis/redis.conf
    ulimits:
      nofile:
        soft: 10032
        hard: 10032
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  postgres:
    <<: *restart_policy
    image: "postgres:14.19-bookworm"
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD-SHELL", "pg_isready -U postgres"]
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB", "-c", "effective_cache_size=64MB"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
    volumes:
      - "sentry-postgres:/var/lib/postgresql/data"
    shm_size: 64m

  pgbouncer:
    <<: *restart_policy
    image: "edoburu/pgbouncer:v1.24.1-p1"
    mem_limit: 64m
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD-SHELL", "psql -U postgres -p 5432 -h 127.0.0.1 -tA -c \"select 1;\" -d postgres >/dev/null"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: postgres
      AUTH_TYPE: trust
      POOL_MODE: transaction
      ADMIN_USERS: postgres,sentry
      MAX_CLIENT_CONN: 1000

  kafka:
    <<: *restart_policy
    image: "confluentinc/cp-kafka:7.6.6"
    mem_limit: 512m
    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1001@127.0.0.1:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_NODE_ID: "1001"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://127.0.0.1:29092,INTERNAL://kafka:9093,EXTERNAL://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_MESSAGE_MAX_BYTES: "50000000"
      KAFKA_MAX_REQUEST_SIZE: "50000000"
      CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
      KAFKA_LOG4J_LOGGERS: "kafka.cluster=WARN,kafka.controller=WARN,kafka.coordinator=WARN,kafka.log=WARN,kafka.server=WARN,state.change.logger=WARN"
      KAFKA_LOG4J_ROOT_LOGLEVEL: "WARN"
      KAFKA_TOOLS_LOG4J_LOGLEVEL: "WARN"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    volumes:
      - "sentry-kafka:/var/lib/kafka/data"
      - "sentry-kafka-log:/var/lib/kafka/log"
      - "sentry-secrets:/etc/kafka/secrets"
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 10s
      retries: 30

  clickhouse:
    <<: *restart_policy
    image: "altinity/clickhouse-server:25.3.6.10034.altinitystable"
    mem_limit: 4g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - "sentry-clickhouse:/var/lib/clickhouse"
      - "sentry-clickhouse-log:/var/log/clickhouse-server"
      - type: "bind"
        read_only: true
        source: "./clickhouse-conf/config.xml"
        target: "/etc/clickhouse-server/config.d/sentry.xml"
      - type: "bind"
        read_only: true
        source: "./clickhouse-conf/default-password.xml"
        target: "/etc/clickhouse-server/users.d/default-password.xml"
    environment:
      MAX_MEMORY_USAGE_RATIO: 0.3
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  seaweedfs:
    <<: *restart_policy
    image: "chrislusf/seaweedfs:4.09_large_disk"
    mem_limit: 128m
    entrypoint: "weed"
    command: >-
        server
        -dir=/data
        -filer=true
        -filer.port=8888
        -filer.defaultReplicaPlacement=000
        -master=true
        -master.port=9333
        -s3=true
        -s3.port=8333
        -volume=true
        -volume.max=0
        -volume.port=8080
        -ip=seaweedfs
        -ip.bind=0.0.0.0
        -webdav=false
    environment:
      AWS_ACCESS_KEY_ID: sentry
      AWS_SECRET_ACCESS_KEY: sentry
    volumes:
      - "sentry-seaweedfs:/data"
    healthcheck:
      test: ["CMD-SHELL", "http_proxy='' wget -q -O- http://seaweedfs:8080/healthz http://seaweedfs:9333/cluster/healthz http://seaweedfs:8333/healthz || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  snuba-api:
    <<: *snuba_defaults
    mem_limit: 512m
    healthcheck:
      <<: *healthcheck_defaults
      test:
        - "CMD"
        - "/bin/bash"
        - "-c"
        - 'exec 3<>/dev/tcp/127.0.0.1/1218 && echo -e "GET /health HTTP/1.1\r\nhost: 127.0.0.1\r\n\r\n" >&3 && grep ok -s -m 1 <&3'

  snuba-errors-consumer:
    <<: *snuba_defaults
    mem_limit: 256m
    command: rust-consumer --storage errors --consumer-group snuba-consumers --auto-offset-reset=latest --max-batch-time-ms 750 --no-strict-offset-reset --health-check-file /tmp/health.txt
    healthcheck:
      test: ["CMD-SHELL", "rm /tmp/health.txt"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 600s

  web:
    <<: *sentry_defaults
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    healthcheck:
      <<: *healthcheck_defaults
      test:
        - "CMD"
        - "/bin/bash"
        - "-c"
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e "GET /_health/ HTTP/1.1\r\nhost: 127.0.0.1\r\n\r\n" >&3 && grep ok -s -m 1 <&3'

  events-consumer:
    <<: *sentry_defaults
    mem_limit: 512m
    command: run consumer ingest-events --consumer-group ingest-consumer --healthcheck-file-path /tmp/health.txt
    healthcheck:
      test: ["CMD-SHELL", "rm /tmp/health.txt"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 600s

  post-process-forwarder-errors:
    <<: *sentry_defaults
    mem_limit: 512m
    command: run consumer --no-strict-offset-reset post-process-forwarder-errors --consumer-group post-process-forwarder --synchronize-commit-log-topic=snuba-commit-log --synchronize-commit-group=snuba-consumers --healthcheck-file-path /tmp/health.txt
    healthcheck:
      test: ["CMD-SHELL", "rm /tmp/health.txt"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 600s

  taskbroker:
    <<: *restart_policy
    image: taskbroker-local
    build:
      context: ./source/taskbroker
    mem_limit: 128m
    environment:
      TASKBROKER_KAFKA_CLUSTER: "kafka:9092"
      TASKBROKER_KAFKA_DEADLETTER_CLUSTER: "kafka:9092"
      TASKBROKER_DB_PATH: "/opt/sqlite/taskbroker-activations.sqlite"
    volumes:
      - sentry-taskbroker:/opt/sqlite
    depends_on:
      kafka:
        condition: service_healthy

  taskscheduler:
    <<: *sentry_defaults
    mem_limit: 384m
    command: run taskworker-scheduler

  taskworker:
    <<: *sentry_defaults
    mem_limit: 512m
    command: run taskworker --concurrency=$SENTRY_TASKWORKER_CONCURRENCY --rpc-host=taskbroker:50051 --health-check-file-path=/tmp/health.txt
    healthcheck:
      test: ["CMD-SHELL", "rm /tmp/health.txt"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 600s

  relay:
    <<: *restart_policy
    image: "$RELAY_IMAGE"
    mem_limit: 256m
    volumes:
      - type: bind
        read_only: true
        source: ./relay-conf
        target: /work/.relay
      - type: bind
        read_only: true
        source: ./geoip
        target: /geoip
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/bin/relay", "healthcheck"]

  nginx:
    <<: *restart_policy
    ports:
      - "$SENTRY_BIND:80/tcp"
    image: "nginx:1.29.5-alpine"
    mem_limit: 64m
    volumes:
      - type: bind
        read_only: true
        source: ./nginx-local.conf
        target: /etc/nginx/nginx.conf
      - sentry-nginx-cache:/var/cache/nginx
    healthcheck:
      <<: *healthcheck_defaults
      test:
        - "CMD"
        - "/usr/bin/curl"
        - http://localhost
    depends_on:
      web:
        condition: service_healthy
        restart: true
      relay:
        condition: service_healthy
        restart: true

volumes:
  sentry-data:
  sentry-postgres:
  sentry-redis:
  sentry-kafka:
  sentry-clickhouse:
  sentry-seaweedfs:
  sentry-taskbroker:
  sentry-secrets:
  sentry-smtp:
  dkim-keys:
    external: true
    name: ${SENTRY_DKIM_VOLUME:-}
  sentry-nginx-cache:
  sentry-kafka-log:
  sentry-clickhouse-log:
